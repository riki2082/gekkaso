<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>山あいの湯宿 月下荘｜公式サイト</title>
<meta name="description" content="大正十五年創業、山あいの湯宿 月下荘の公式サイトです。客室、お料理、温泉、ご予約のご案内。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@400;500;600&family=Cormorant+Garamond:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--main:#5a3e2b;--main2:#8a5a3b;--sky:#f6f1e8;--ink:#2b2622;--muted:#7a6e64;--line:#e4dbcf;--bg:#fcfaf6;--card:#fff;--accent:#a3392b;--foot:#2e231b;--gold:#b08d57}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;font-size:15px;line-height:1.95;letter-spacing:.05em;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;transition:background 1.2s,color 1.2s}
a{color:inherit;text-decoration:none}
.serif{font-family:"Noto Serif JP",serif}
.en{font-family:"Cormorant Garamond",serif;letter-spacing:.16em;font-weight:500}
.inner{max-width:1040px;margin:0 auto;padding:0 20px}
.util{background:var(--main);color:#efe3d3;font-size:11.5px}
.util .inner{display:flex;justify-content:space-between;align-items:center;height:32px;gap:10px}
.util .tick{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.gh{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.gh .inner{display:flex;align-items:center;height:70px;gap:18px}
.logo{display:flex;align-items:center;gap:12px;flex-shrink:0}
.logo svg{width:38px;height:38px}
.logo .jp{font-family:"Noto Serif JP",serif;font-weight:600;font-size:19px;letter-spacing:.3em;line-height:1.2;display:block}
.logo .sub{font-size:10px;color:var(--muted);display:block;letter-spacing:.2em}
.gnav{display:flex;gap:22px;margin-left:auto;font-size:13.5px}
.gnav a{padding:23px 0;border-bottom:1px solid transparent}
.gnav a.on,.gnav a:hover{border-color:var(--main2);color:var(--main2)}
.rsv{background:var(--accent);color:#fff;font-size:13px;padding:9px 18px;white-space:nowrap;letter-spacing:.15em}
.hamb{display:none;margin-left:auto;background:none;border:none;width:40px;height:40px;cursor:pointer}
.hamb span{display:block;height:1.5px;background:var(--ink);margin:6px 8px}
.drawer{display:none;background:var(--card);border-bottom:1px solid var(--line)}
.drawer.open{display:block}
.drawer a{display:block;padding:13px 20px;border-top:1px solid var(--line);font-size:14px}
@media(max-width:900px){.gnav,.gh .rsv{display:none}.hamb{display:block}}
main{min-height:60vh}
section{padding:58px 0}
section.alt{background:var(--sky)}
.sh{text-align:center;margin-bottom:30px}
.sh .en{display:block;font-size:13px;color:var(--gold)}
.sh h2{font-family:"Noto Serif JP",serif;font-size:24px;font-weight:500;letter-spacing:.3em}
.pagehead{background:var(--main);color:#fff;padding:46px 0 38px;text-align:center}
.pagehead .en{font-size:13px;color:#e0c9a6}
.pagehead h1{font-family:"Noto Serif JP",serif;font-size:26px;font-weight:500;letter-spacing:.3em}
.crumb{font-size:12px;color:var(--muted);padding:12px 0}
.crumb a{color:var(--main2)}
.lead{font-size:14.5px;margin-bottom:22px}
.note{font-size:12.5px;color:var(--muted)}
.btn{display:inline-block;border:1px solid var(--main);color:var(--main);padding:10px 30px;font-size:13.5px;margin-top:18px;letter-spacing:.2em;background:none;cursor:pointer;font-family:inherit}
.ph{background:linear-gradient(160deg,#b9a389,#4a3628);overflow:hidden;position:relative}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.hero{position:relative;height:min(78vh,580px);overflow:hidden;color:#fff}
.hero .ph{position:absolute;inset:0}
.hero .cover{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.1),rgba(0,0,0,.5))}
.hero .copy{position:absolute;right:8%;top:50%;transform:translateY(-50%);writing-mode:vertical-rl;font-family:"Noto Serif JP",serif;font-size:clamp(20px,3.4vw,30px);letter-spacing:.4em;line-height:2;text-shadow:0 2px 12px rgba(0,0,0,.4)}
.hero .copy small{display:block;font-size:13px;letter-spacing:.3em;margin-right:14px;opacity:.9}
.welcome{background:var(--sky);text-align:center;padding:14px;font-family:"Noto Serif JP",serif;font-size:14.5px;border-bottom:1px solid var(--line)}
.concept{max-width:640px;margin:0 auto;text-align:center;font-family:"Noto Serif JP",serif;font-size:15.5px;line-height:2.4}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:24px}
.card .ph{aspect-ratio:4/3}
.card .meta{font-size:12px;color:var(--muted);margin-top:10px;letter-spacing:.1em}
.card h3{font-family:"Noto Serif JP",serif;font-size:16.5px;font-weight:500;margin:2px 0 4px;letter-spacing:.15em}
.card p{font-size:13.5px;color:var(--muted);line-height:1.85}
.news{border-top:1px solid var(--line)}
.news li{list-style:none;border-bottom:1px solid var(--line);padding:15px 4px;display:grid;grid-template-columns:auto 1fr;gap:4px 18px;font-size:14.5px}
.news time{font-family:"Cormorant Garamond",serif;font-size:15px;color:var(--muted);letter-spacing:.08em}
@media(max-width:640px){.news li{grid-template-columns:1fr}}
.dtable{width:100%;border-collapse:collapse;font-size:14px;margin-bottom:22px}
.dtable th,.dtable td{border-bottom:1px solid var(--line);padding:12px 10px;text-align:left;font-weight:400;vertical-align:top}
.dtable th{width:32%;color:var(--main2);font-weight:500}
h3.sub{font-family:"Noto Serif JP",serif;font-size:18px;font-weight:500;letter-spacing:.18em;border-bottom:1px solid var(--line);padding-bottom:8px;margin:34px 0 16px}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.room{border:1px solid var(--line);background:var(--card);padding:14px;text-align:center}
.room .no{font-family:"Cormorant Garamond",serif;font-size:14px;color:var(--gold)}
.room b{display:block;font-family:"Noto Serif JP",serif;font-weight:500;font-size:17px;letter-spacing:.2em}
.room small{font-size:11.5px;color:var(--muted)}
.post{border-bottom:1px solid var(--line);padding:24px 0}
.post time{font-family:"Cormorant Garamond",serif;font-size:15px;color:var(--muted)}
.post h3{font-family:"Noto Serif JP",serif;font-size:18px;font-weight:500;margin:4px 0 10px;letter-spacing:.1em}
.post p{font-size:14.5px}
.post .by{font-size:12px;color:var(--muted);margin-top:10px;text-align:right}
.q{font-weight:500;margin-top:22px;padding-left:1.8em;text-indent:-1.8em}.q::before{content:"問";font-family:"Noto Serif JP";color:var(--main2);margin-right:.7em}
.a{font-size:14px;padding:8px 0 18px 1.8em;text-indent:-1.8em;border-bottom:1px solid var(--line)}.a::before{content:"答";font-family:"Noto Serif JP";color:var(--accent);margin-right:.7em}
.hist li{list-style:none;display:grid;grid-template-columns:150px 1fr;gap:14px;border-bottom:1px solid var(--line);padding:14px 4px;font-size:14.5px}
.hist time{font-family:"Noto Serif JP",serif;color:var(--main2)}
@media(max-width:640px){.hist li{grid-template-columns:1fr;gap:2px}}
.clockbox{display:flex;gap:24px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);padding:20px;margin-bottom:24px}
.clockbox svg{width:150px;height:150px;flex-shrink:0}
.form{display:grid;gap:14px;max-width:560px}
.form label{font-size:13px;color:var(--main2);display:block;margin-bottom:4px}
.form input,.form select{width:100%;font:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font-size:12px;text-align:center;margin-bottom:8px}
.cal div{border:1px solid var(--line);padding:6px 0;background:var(--card);line-height:1.4}
.cal .h{background:var(--sky);border:none}
.cal .full{color:#bbb}
.cal .ok{color:var(--accent);font-weight:700;border-color:var(--accent)}
.done{border:1px solid var(--gold);background:var(--card);padding:22px;text-align:center;font-family:"Noto Serif JP",serif}
.done .no{font-family:"Cormorant Garamond",serif;font-size:28px;color:var(--accent);letter-spacing:.2em}
.map{width:100%;max-width:600px;display:block;margin:0 auto;background:var(--card);border:1px solid var(--line)}
.banners{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.bn{border:1px solid var(--line);background:var(--card);padding:18px;display:flex;flex-direction:column;gap:2px}
.bn b{font-family:"Noto Serif JP",serif;font-weight:500}.bn small{font-size:12px;color:var(--muted)}.bn .en{font-size:12px;color:var(--gold)}
footer{background:var(--foot);color:#d9cbb8;font-size:13px;padding:48px 0 22px}
.fcols{display:grid;grid-template-columns:1.4fr repeat(2,1fr);gap:24px}
.fcols h4{font-family:"Cormorant Garamond",serif;font-size:14px;color:#fff;font-weight:500;margin-bottom:10px;letter-spacing:.2em}
.fcols a{display:block;line-height:2.3;opacity:.85}
.fbottom{border-top:1px solid rgba(255,255,255,.15);margin-top:32px;padding-top:16px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:11.5px;opacity:.75}
.fbottom button{background:none;border:none;color:inherit;font:inherit;text-decoration:underline;cursor:pointer}
@media(max-width:760px){.fcols{grid-template-columns:1fr 1fr}.fcols>div:first-child{grid-column:1/-1}}
/* ===== 夜（ダークモード） ===== */
body.night{--main:#1c2233;--main2:#c9a76a;--sky:#121725;--ink:#d8d3c8;--muted:#8a8676;--line:#262d40;--bg:#0b0f1a;--card:#11162a;--accent:#c46a3a;--foot:#060810;--gold:#c9a76a}
body.night .ph img{filter:brightness(.55) saturate(.6) hue-rotate(190deg)}
body.night .util{background:#0a0d16}
/* ===== 裏・過去 ===== */
.dark{background:#070605;color:#d6cdbf;padding:28px 22px;font-family:"Noto Serif JP",serif;position:relative;overflow:hidden;box-shadow:inset 0 0 80px #000}
.dark h2{font-weight:500;font-size:22px;letter-spacing:.2em;color:#e2d3b8;margin-bottom:12px}
.dark .warn{font-size:12px;letter-spacing:.4em;color:#b08d57;text-align:center;margin-bottom:10px;font-family:"Cormorant Garamond",serif}
.dark p{font-size:14.5px}
.dark input{font:inherit;font-size:16px;padding:9px 10px;background:#15110d;border:1px solid #4a3a2a;color:#efe5d5;min-width:0;flex:1}
.dark button{font:inherit;background:#2a1d14;color:#efe5d5;border:1px solid #6b4a30;padding:9px 16px;cursor:pointer}
.dark button:disabled{opacity:.35;cursor:default}
.row{display:flex;gap:6px;margin-top:12px}
.msg{min-height:22px;font-size:13px;margin-top:8px;color:#e07a5f}
.poem{writing-mode:vertical-rl;margin:16px auto;padding:22px 18px;background:#e9e0cc;color:#2a2018;font-size:19px;letter-spacing:.35em;line-height:2.3;height:300px;border:8px solid #3a2a1c;box-shadow:0 4px 18px #000;max-width:100%;overflow-x:auto}
.ledger{background:#efe6d2;color:#2a2018;padding:18px;margin:14px 0;font-size:14px;line-height:2}
.ledger table{width:100%;border-collapse:collapse}
.ledger td,.ledger th{border-bottom:1px solid #bba98a;padding:6px 4px;text-align:left;font-weight:400}
.ledger .me{color:#8a1d12;font-weight:600}
.still{height:6px;background:#2a1d14;margin:12px 0;position:relative;overflow:hidden}
.still i{position:absolute;left:0;top:0;bottom:0;width:0;background:#b08d57}
.choice{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.choice button.sel{background:#6b4a30}
.timer{position:sticky;top:76px;z-index:5;display:flex;align-items:center;gap:12px;background:#1b0d08;border:1px solid #7a2a18;padding:8px 12px;margin-bottom:14px;color:#f0b48a;font-size:13px}
.timer svg{width:46px;height:46px}
body.past{--main:#3a2416;--main2:#c08a5a;--sky:#160f0a;--ink:#d8c9b4;--muted:#8a7660;--line:#2c1f15;--bg:#0d0805;--card:#140d08;--accent:#c0392b;--foot:#050302}
body.past .ph img{filter:sepia(1) brightness(.5) contrast(1.2)}
body.past .logo{animation:flick 5s infinite}
@keyframes flick{0%,92%,100%{opacity:1}93%{opacity:.25}95%{opacity:1}97%{opacity:.4}}
.glitch{animation:gl 4s infinite;display:inline-block}
@keyframes gl{0%,95%,100%{transform:none}96%{transform:translateX(3px) skewX(8deg)}97%{transform:translateX(-3px)}}
.smoke{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 120%,rgba(160,60,20,var(--f,0)) 0,transparent 60%)}
#end{position:fixed;inset:0;background:#000;color:#e2d8c8;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;font-family:"Noto Serif JP",serif;text-align:center;overflow-y:auto}
#end p{opacity:0;transition:opacity 1.6s;margin:7px 0;font-size:15.5px;letter-spacing:.14em}
#end p.v{opacity:1}
#end button{margin:22px 4px 0;background:none;border:1px solid #5a4a3a;color:#cbb;padding:8px 18px;font:inherit;opacity:0;transition:opacity 2s;cursor:pointer}
</style>
</head>

const KEY="gekkaso-v1";
let S={stage:0,name:"",res:"",ends:[],last:0};
try{S={...S,...JSON.parse(localStorage.getItem(KEY)||"{}")}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
function setStage(n){if(n>S.stage){S.stage=n;save()}apply()}
/* stage: 0 初期 / 1 閏の間を見つけた / 2 閏の間に入った / 3 宿帳 / 4 昭和61年(足音をやり過ごした) / 5 蔵の鍵 / 9 エンド後 */
const after=n=>S.stage===9&&S.last===n;
const END_T={1:"記帳",2:"焼失",3:"ひとり",4:"灯り"};
const nm=()=>S.name||"お名前のない";
const mq=matchMedia("(prefers-color-scheme: dark)");
const isNight=()=>mq.matches||new Date().getHours()<5;
const inPast=()=>["#s61"].includes(location.hash)&&S.stage>=3&&S.stage<9;
const pad=n=>String(n).padStart(2,"0");
const now=new Date();
const MD=`${now.getMonth()+1}月${now.getDate()}日`;
const RESNO=`13-${pad(now.getMonth()+1)}${pad(now.getDate())}`;
const hira=s=>s.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
const norm=s=>hira((s||"").trim().replace(/[\s　、。,.・]/g,"").replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)));
const esc=s=>(s||"").replace(/[<>&"']/g,"");
function apply(){
  document.body.classList.toggle("night",isNight()&&!inPast());
  document.body.classList.toggle("past",inPast());
  const t=document.getElementById("ticker");
  t.textContent= after(1)?`本日は、${nm()}様のご宿泊でございます。……いつまでも。`
    : after(4)?`${MD}　本日、${nm()}様のご到着をお待ちしております`
    : inPast()?"昭和六十一年　"+MD+"　午前二時"
    : S.stage>=3?"帳場の灯りは、消さずにおきます"
    : isNight()?"夜の月下荘へ、ようこそ"
    : "紅葉が見ごろを迎えております　｜　年末年始のご予約を承っております";
  document.getElementById("utilR").textContent=S.name&&!inPast()?`${esc(S.name)} 様`:"";
  document.getElementById("logoText").textContent= inPast()?"月下荘　昭和六十一年":"月下荘";
  const w=document.getElementById("welcome");
  w.innerHTML= S.res&&!inPast()&&(location.hash||"#top").match(/^#top$/)?`<div class="welcome">${esc(nm())}様　${after(4)?"――ようやく、お会いできますね。":"ご予約ありがとうございます。当日は、灯りを目印にお越しくださいませ。"}</div>`:"";
}

/* ================= 時計（昼は動き、夜は止まる） ================= */
function clockSVG(id){
  let ticks="";for(let i=0;i<12;i++){const a=i*30*Math.PI/180;ticks+=`<line x1="${60+44*Math.sin(a)}" y1="${60-44*Math.cos(a)}" x2="${60+50*Math.sin(a)}" y2="${60-50*Math.cos(a)}" stroke="currentColor" stroke-width="${i%3?1:2.5}"/>`}
  return `<svg viewBox="0 0 120 120" id="${id}" style="color:var(--ink)"><circle cx="60" cy="60" r="56" fill="var(--card)" stroke="var(--main2)" stroke-width="3"/>${ticks}
  <line class="hh" x1="60" y1="60" x2="60" y2="34" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
  <line class="mh" x1="60" y1="60" x2="60" y2="18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  <line class="sec" x1="60" y1="66" x2="60" y2="16" stroke="var(--accent)" stroke-width="1"/><circle cx="60" cy="60" r="3" fill="var(--accent)"/></svg>`;
}
function setHands(svg,h,m,s){
  if(!svg)return;
  svg.querySelector(".hh").setAttribute("transform",`rotate(${(h%12)*30+m*.5} 60 60)`);
  svg.querySelector(".mh").setAttribute("transform",`rotate(${m*6+s*.1} 60 60)`);
  const se=svg.querySelector(".sec"); se.style.display=s===null?"none":""; if(s!==null) se.setAttribute("transform",`rotate(${s*6} 60 60)`);
}
setInterval(()=>{
  document.querySelectorAll("svg.liveclock").forEach(sv=>{
    if(isNight()) setHands(sv,2,45,null);
    else{const d=new Date();setHands(sv,d.getHours(),d.getMinutes(),d.getSeconds())}
  });
},500);

document.addEventListener("copy",e=>{
  const sel=getSelection();if(!sel||!sel.rangeCount)return;

});

  <p>呼び鈴を鳴らすと、帳場のほうで灯りがともった。<br>誰もいない帳場に、宿帳が開いて置かれている。</p>
  <div class="ledger"><table><tr><th>日付</th><th>お名前</th><th>お部屋</th><th>予約番号</th></tr>
   <tr><td>令和${y-2018}年 ${MD}</td><td class="me">${esc(nm())}</td><td>閏</td><td>${S.res||"――"}</td></tr>
   <tr><td>令和${y-2019}年 ${MD}</td><td class="me">${esc(nm())}</td><td>閏</td><td>${S.res||"――"}</td></tr>
   <tr><td>令和${y-2020}年 ${MD}</td><td class="me">${esc(nm())}</td><td>閏</td><td>${S.res||"――"}</td></tr>
   <tr><td colspan="4" style="text-align:center">……</td></tr></table></div>
  <p>毎年、同じ日に、同じ名前。<br>いちばん古いページは、糊で貼りついていて、めくれない。<br>紙片がはさまっている。「<b>過去は、戻ることでしか、めくれない</b>」</p>
  <p style="margin-top:16px;font-size:13px;color:#8a7660">宿帳の横に、筆と硯。「ご記帳ください」</p>
  <button id="sign" style="margin-top:6px">宿帳に記帳する</button>
  </div></div></section>`;
}
function armBack(){ // 宿帳の「ひとつ前」を、昭和61年にすり替える
  try{history.replaceState(null,"","#s61");history.pushState(null,"","#yado")}catch(e){}
}

/* ================= 昭和61年 ================= */
let T={start:0,pen:0,raf:0,idle:0};
const LIMIT=240000; // 実時間4分で 2:30 → 2:45
function gameMin(){return Math.min(15,Math.floor((Date.now()-T.start+T.pen)/(LIMIT/15)))}
function vS61(){
  if(S.stage<3||S.stage>=9) return notFound();
  let h=`<section style="padding:24px 0"><div class="inner" style="max-width:720px">`;
  if(S.stage>=4) h+=`<div class="timer"><span>${clockSVG("pc")}</span><div><b>昭和六十一年 ${MD}</b><br>帳場の柱時計　<span id="ptime">午前2時30分</span>　<span id="pwarn"></span></div></div>`;
  h+=`<div class="dark"><div class="smoke" id="smoke"></div><div class="warn">SHOWA 61</div><h2>あの夜</h2>
   <p>気がつくと、宿帳の前に立っていた。<br>帳場の灯りが、新しい。壁の暦は、<b>昭和六十一年 ${MD}</b>。<br>柱時計は、午前二時半を指して、動いている。</p>`;
  if(S.stage<4){
    h+=`<p style="margin-top:14px">――廊下の奥から、足音が近づいてくる。<br>見つかっては、いけない気がする。</p>
    <div class="still"><i id="stillbar"></i></div><p style="font-size:12px;color:#8a7660" id="stillmsg">……</p>`;
  }else{
    h+=`<p style="margin-top:12px;color:#c9a76a">足音は、遠ざかっていった。<br>かわりに、焦げくさい匂い。離れのほうから、煙が流れてくる。</p>
    <div class="ledger"><b>昭和六十一年 ${MD} の宿帳</b><table><tr><th>お名前</th><th>到着</th><th>お部屋</th></tr>
     <tr><td>田村 様</td><td>？</td><td>？</td></tr><tr><td>小野 様</td><td>？</td><td>？</td></tr><tr><td>森 様</td><td>？</td><td>？</td></tr><tr><td>加藤 様</td><td>？</td><td>？</td></tr>
     <tr><td class="me">${esc(nm())} 様</td><td>――</td><td>閏</td></tr></table>
     <p style="font-size:13px;margin-top:10px">余白に、仲居見習いの丸い字で：</p>
     <ol style="font-size:13.5px;padding-left:1.4em;line-height:1.9">
      <li>この日のお客さまは、15時・16時・17時・18時に一人ずつ。お部屋は睦月・弥生・卯月・葉月。</li>
      <li>葉月の間のお客さまが、いちばんに着いた。</li>
      <li>卯月の間のお客さまは、17時に着いた。</li>
      <li>加藤さまは弥生の間。最後に着いたのは、加藤さまではない。</li>
      <li>田村さまは、森さまより、あとに着いた。</li>
      <li>小野さまは卯月の間ではないし、最後でもない。</li>
      <li>森さまのお部屋の番号は、田村さまのお部屋の番号より大きい。</li>
     </ol>
     <p style="font-size:13.5px;margin-top:8px">「蔵の鍵は、<b>最後に着いたお客さまのお部屋</b>の床の間に、おあずけしました。　すず」</p></div>`;
    if(S.stage<5){
      h+=`<p>どの部屋を探す？</p><div class="choice" id="rooms4">${["睦月","弥生","卯月","葉月"].map(r=>`<button data-r="${r}">${r}の間</button>`).join("")}</div><div class="msg" id="rmsg"></div>`;
    }else{
      h+=`<p style="color:#c9a76a">睦月の間の床の間に、古い鍵があった。<br>煙をかきわけて、裏の蔵へ走る。</p>
      <p style="margin-top:12px">蔵の戸を開けると、暗がりの奥で、小さな女の子が膝を抱えていた。<br>仲居見習いの着物。胸の名札に「すず」。<br>「……だれ？　こわいよ」</p>
      <div class="choice" id="kura"><button id="hand">すずの手を引く</button></div><p class="msg" id="hmsg" style="color:#c9a76a"></p>
      <p style="margin-top:12px">煙が、蔵の中まで入ってくる。どこから出る？</p>
      <div class="choice"><button data-x="watari">渡り廊下へ戻る</button><button data-x="genkan">本館の玄関へ走る</button><button data-x="oku">蔵の奥を手さぐりする</button></div>`;
    }
  }
  return h+`</div></div></section>`;
}
let holding=false;
function startTimer(){
  if(!T.start) T.start=Date.now();
  cancelAnimationFrame(T.raf);
  const loop=()=>{
    const el=document.getElementById("ptime");if(!el)return;
    const m=gameMin();el.textContent=`午前2時${30+m}分`;
    setHands(document.getElementById("pc"),2,30+m,null);
    const sm=document.getElementById("smoke");if(sm)sm.style.setProperty("--f",(m/15*.8).toFixed(2));
    document.getElementById("pwarn").textContent=m>=12?"――火が、まわる":"";
    if(m>=15){ending(2);return}
    T.raf=requestAnimationFrame(loop)};
  loop();
}
function startIdle(){
  clearInterval(T.idle);let still=0;const need=12;
  const reset=()=>{still=0;const m=document.getElementById("stillmsg");if(m)m.textContent="……動いた。足音が、こちらへ向かってくる。"};
  ["pointerdown","pointermove","touchstart","wheel","keydown","scroll"].forEach(ev=>window.addEventListener(ev,reset,{passive:true}));
  T.idle=setInterval(()=>{
    const b=document.getElementById("stillbar");if(!b){clearInterval(T.idle);return}
    still++;b.style.width=Math.min(100,still/need*100)+"%";
    const m=document.getElementById("stillmsg");if(m&&still>1)m.textContent=still<need?"……息をひそめる。":"";
    if(still>=need){clearInterval(T.idle);["pointerdown","pointermove","touchstart","wheel","keydown","scroll"].forEach(ev=>window.removeEventListener(ev,reset));setStage(4);T.start=Date.now();T.pen=0;route()}
  },1000);
}

/* ================= ルーティング ================= */
const VIEWS={top:vTop,rooms:vRooms,cuisine:vCuisine,onsen:vOnsen,guide:vGuide,history:vHistory,blog:vBlog,reserve:vReserve,faq:vFaq,news:vNews,credits:vCredits,uruu:vUruu,yado:vYado,s61:vS61};
let lastHash="";
function route(){
  const h=(location.hash||"#top").slice(1);
  apply();
  document.getElementById("gnav").innerHTML=PAGES.map(([k,v])=>`<a href="#${k}" class="${k===h?"on":""}">${v}</a>`).join("");
  document.getElementById("drawer").innerHTML=[...PAGES,...EXTRA].map(([k,v])=>`<a href="#${k}">${v}</a>`).join("");
  document.getElementById("drawer").classList.remove("open");
  document.getElementById("main").innerHTML=(VIEWS[h]||notFound)();
  if(lastHash!==h) window.scrollTo(0,0);
  lastHash=h; bind(h);
}
window.addEventListener("hashchange",route);
document.getElementById("hamb").onclick=()=>document.getElementById("drawer").classList.toggle("open");
function shake(el){if(el)el.animate([{transform:"translateX(-5px)"},{transform:"translateX(5px)"},{transform:"none"}],{duration:300})}

function bind(h){
  const rf=document.getElementById("rf");
  if(rf) rf.onsubmit=e=>{e.preventDefault();const v=document.getElementById("rname").value.trim();if(!v)return;S.name=v.slice(0,20);S.res=RESNO;save();route()};
  const uf=document.getElementById("uf");
  if(uf) uf.onsubmit=e=>{e.preventDefault();const v=norm(document.getElementById("ufi").value),m=document.getElementById("umsg");
    if(!S.res){m.textContent="錠前は動かない。……ご予約が、ないからだろうか。";shake(uf);return}
    if(v==="0245"||v==="245"){setStage(2);route()}else{m.textContent="錠前は、びくともしない。";shake(uf)}};
  const bf=document.getElementById("bf");
  if(bf) bf.onsubmit=e=>{e.preventDefault();const v=norm(document.getElementById("bfi").value),m=document.getElementById("bmsg");
    if(v===norm(SECRET)){setStage(3);location.hash="#yado";return}
    if(v.includes(norm("月の下"))||v.includes("つきのした")||v.includes("ひとつ灯り")){m.textContent="……呼び鈴は鳴らない。書き写したものではなく、写しとったものを。";shake(bf);return}
    m.textContent=v?"呼び鈴は、沈黙している。":"";shake(bf)};
  if(h==="yado"&&S.stage>=3&&S.stage<9) armBack();
  const sg=document.getElementById("sign"); if(sg) sg.onclick=()=>ending(1);
  if(h==="s61"&&S.stage===3) startIdle();
  if(h==="s61"&&S.stage>=4&&S.stage<9) startTimer();
  const r4=document.getElementById("rooms4");
  if(r4) r4.querySelectorAll("button").forEach(b=>b.onclick=()=>{
    if(b.dataset.r==="睦月"){setStage(5);route();return}
    T.pen+=LIMIT/15*2.5; b.disabled=true; document.getElementById("rmsg").textContent=`${b.dataset.r}の間の床の間には、何もなかった。……煙が濃くなる。`;});
  const hand=document.getElementById("hand");let withSuzu=false;
  if(hand) hand.onclick=()=>{withSuzu=true;hand.disabled=true;hand.textContent="すずの手を握った";document.getElementById("hmsg").textContent="小さな手が、ぎゅっと握り返してくる。"};
  document.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{
    const x=b.dataset.x;
    if(x!=="oku"){ending(2,x);return}
    ending(withSuzu?4:3);
  });
}

/* ================= エンディング ================= */
function endLines(id,x){
  const n=esc(nm());
  return {
   1:[`筆をとり、「${n}」と記す。`,"墨が乾くより先に、帳場の灯りがふっと消えた。","廊下の奥から、仲居の声がする。","「いらっしゃいませ。お部屋は、閏の間でございます」","来年も、再来年も。","あなたは毎年、同じ日に、この宿へ予約を入れる。"],
   2:[x==="watari"?"渡り廊下は、すでに炎に包まれていた。":x==="genkan"?"玄関へ続く廊下は、煙で何も見えなかった。":"柱時計が、午前二時四十五分を打った。","熱い。息ができない。","遠くで、女の子の泣き声がする。","……時計の針は、そこで止まった。","四十年後も、ずっと。"],
   3:["蔵の奥の板壁が、きしんで開いた。","冷たい沢の空気。あなたは、ひとりで外へ転がり出た。","振り返ると、蔵は炎の中だった。","……あの子は？","気がつくと、令和の月下荘の前に立っていた。","帳場の灯りは、今年も、消えていない。"],
   4:["蔵の奥の板壁が、きしんで開いた。","すずの手を引いて、冷たい沢へ転がり出る。","背後で、蔵が崩れる音がした。","「……ありがとう」","小さな声。握った手の、ぬくもり。","――気がつくと、夜明けの月下荘の前に立っていた。",`帳場から出てきた年配の女将が、あなたを見て、涙ぐむ。`,`「${n}様。……お待ちしておりました」`]
  }[id];
}
function ending(id,x){
  cancelAnimationFrame(T.raf);clearInterval(T.idle);
  if(!S.ends.includes(id)) S.ends.push(id);
  S.stage=9;S.last=id;save();
  const lines=[...endLines(id,x),`<span class="en" style="font-size:14px;color:#c9a76a">${id===4?"TRUE END":"END "+id}　―　${END_T[id]}</span>`,`<small style="font-size:12px;color:#8a7660">結末 ${S.ends.length} / 4</small>`];
  const d=document.createElement("div");d.id="end";
  if(id===4) d.style.background="linear-gradient(#0b0f1a,#2a2236 60%,#a8704a)";
  if(id===2) d.style.background="radial-gradient(ellipse at 50% 110%,#5a1a08,#000 70%)";
  d.innerHTML=lines.map(l=>`<p>${l}</p>`).join("")+`<div><button id="eb1">トップへ戻る</button><button id="eb2">あの夜に、もう一度戻る</button></div>`;
  document.body.appendChild(d);
  const ps=d.querySelectorAll("p");
  ps.forEach((p,i)=>setTimeout(()=>p.classList.add("v"),700+i*1400));
  setTimeout(()=>d.querySelectorAll("button").forEach(b=>b.style.opacity=1),700+ps.length*1400);
  d.querySelector("#eb1").onclick=()=>{d.remove();location.hash="#top";route()};
  d.querySelector("#eb2").onclick=()=>{d.remove();S.stage=3;S.last=0;save();T={start:0,pen:0,raf:0,idle:0};location.hash="#yado";route()};
}

/* タブを離れたとき */
const baseTitle=document.title;
document.addEventListener("visibilitychange",()=>{document.title=document.hidden&&S.stage>=1&&S.stage<9?"灯りは、消さずにおきます":baseTitle});

document.getElementById("reset").onclick=function(){
  if(this.dataset.c){try{localStorage.removeItem(KEY)}catch(e){}S={stage:0,name:"",res:"",ends:[],last:0};this.dataset.c="";this.textContent="データを初期化";location.hash="#top";route();}
  else{this.dataset.c=1;this.textContent="本当に初期化する？（もう一度押す）"}
};
route();
</script>
